<html>
    <head>
        <title> Science Lab</title>
        <meta charset="utf-8">
    
        <meta name="viewport" content="width=device-width, initial-scale=1">
    
        <!-- STEP 1 - Bootstrap CSS link -->
    
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    </head>

    <body>
        <div class="jumbotron jumbotron-fluid">
               <div class="container">
                   <h1 class="display-4">Science Lab</h1>
                   <p class="lead">This is a simple hero unit, a simple jumbotron-style component for calling extra attention to featured content or information.</p>

                   <button class=" btn btn-primary"> Chemestry </button>
                   <button class=" btn btn-success"> Biology </button>
                   <button class=" btn btn-warning"> Physics </button>
                   <button class=" btn btn-danger"> Astrology </button>
               </div>
        </div>

        <div class="container">
            <h1 class=" experiment title"> Experiment Completed <span class=" badge badge-primary"> 4 </span></h1>
            <p> Chemestry <span class=" badge badge-secondary"> 1 </span></p>
            <p> Biology <span class=" badge badge-success"> 1 </span></p>
            <p> Physics <span class=" badge badge-warning"> 1 </span></p>
            <p> Astrology <span class=" badge badge-danger"> 1 </span></p>

            <h1 class="Section-title"> Progress Bar </h1>
           
            <p> Chemestry </p>
                <div class=" progress mb-3">
                     <div class="progress-bar bg-secondary" style="width: 150%"> 150%</div>
                </div> 
                  <p> Physics </p>
                <div class=" progress mb-3">
                     <div class="progress-bar bg-success" style="width: 25%"> 25%</div>
                </div> 
                  <p> Biology </p>
                <div class=" progress mb-3">
                     <div class="progress-bar bg-warning" style="width: 15%"> 15%</div>
                </div> 
                  <p> Astronomy </p>
                <div class=" progress mb-3">
                     <div class="progress-bar bg-danger" style="width: 5%"> 5%</div>
                </div>             
        </div>
    </body>
</html>
