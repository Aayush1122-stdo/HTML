<html>
    <head>
        <title> -- java Script-- </title>
    </head>
    <body>
            <button onclick="myfunction(6,3)"> Execute Button</button>

            <script>
                function myfunction(x,y)
                {
                    if(undefined === y)
                    {
                        y = 2;
                    }
                    document.write(x*y)
                }
            </script>
    </body>
</html>
