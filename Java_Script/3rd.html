<html>

<head>
    <title> -- java Script-- </title>
</head>

<body>
    <button onclick="myfunction()"> Execute Button</button>
    <p id="demo"></p>
     <p id="demo1"></p>
      <p id="demo2"></p>

    <script>
              var a = 5;
              function myfunction()
              {
                var b = 8;
               document.getElementById("demo").innerHTML = a*b; 
               document.getElementById("demo2").innerHTML = b;
              }
               document.getElementById("demo1").innerHTML = a;
           
    </script>
</body>

</html>
